services:
  api-gatway:
    container_name: api-gatway
    image: nginx:alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"
    depends_on:
      - user-service

  redis:
    container_name: redis
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  user-service:
    container_name: user-service
    build: 
      context: ./services/user_service
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - user-service-db
      - redis
    env_file:
      - ./services/user_service/.env
    restart: "always"
  
  user-service-db:
    container_name: user-service-db
    image: postgres:trixie
    volumes:
      - user_service_db_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB_USER_SERVICE}
      - POSTGRES_USER=${POSTGRES_USER_USER_SERVICE}
      - POSTGRES_PASSWORD=${PASSWORD_USER_SERVICE}
    restart: "always"


volumes:
  redis_data:
  user_service_db_data: